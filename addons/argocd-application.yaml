apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: myres-trip-dev-v2
  namespace: argocd

spec:
  project: default

  source:
    repoURL: https://github.com/erkanozmenli/MyRes-GitOps.git
    targetRevision: main
    path: gitops-v2/environments/dev

  destination:
    server: https://kubernetes.default.svc
    namespace: dev-v2

  syncPolicy:
    automated:
      prune: true
      selfHeal: true

  ignoreDifferences:
    # HPA runtime state değişimleri
    - group: autoscaling
      kind: HorizontalPodAutoscaler
      jsonPointers:
        - /status

    # Deployment replica değişimi (HPA ile conflict olmaması için önemli)
    - group: apps
      kind: Deployment
      jsonPointers:
        - /spec/replicas