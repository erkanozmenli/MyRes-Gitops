apiVersion: v1
kind: ConfigMap
metadata:
  name: otel-collector-config

data:
  config.yaml: |
    receivers:
      otlp:
        protocols:
          grpc:
            endpoint: 0.0.0.0:4317
          http:
            endpoint: 0.0.0.0:4318

    processors:
      batch:

    exporters:
      otlphttp/grafana:
        endpoint: https://otlp-gateway-prod-gb-south-1.grafana.net/otlp
        headers:
          Authorization: "${GRAFANA_AUTH}"

    service:
      pipelines:
        traces:
          receivers: [otlp]
          processors: [batch]
          exporters: [otlphttp/grafana]

        metrics:
          receivers: [otlp]
          processors: [batch]
          exporters: [otlphttp/grafana]

        logs:
          receivers: [otlp]
          processors: [batch]
          exporters: [otlphttp/grafana]