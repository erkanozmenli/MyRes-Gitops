apiVersion: apps/v1
kind: Deployment
metadata:
  name: rabbitmq-svc
  labels:
    app.kubernetes.io/name: rabbitmq
    app.kubernetes.io/component: message-broker
    app.kubernetes.io/part-of: myres
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: rabbitmq
      app.kubernetes.io/component: message-broker
  template:
    metadata:
      labels:
        app.kubernetes.io/name: rabbitmq
        app.kubernetes.io/component: message-broker
        app.kubernetes.io/part-of: myres
    spec:
      containers:
        - name: rabbitmq
          image: docker.io/library/rabbitmq:4.2-management
          ports:
            - name: amqp
              containerPort: 5672
            - name: management
              containerPort: 15672
