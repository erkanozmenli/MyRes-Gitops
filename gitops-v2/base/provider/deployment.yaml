apiVersion: apps/v1
kind: Deployment
metadata:
  name: provider-svc
  labels:
    app.kubernetes.io/name: provider
    app.kubernetes.io/component: api
    app.kubernetes.io/part-of: myres
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: provider
      app.kubernetes.io/component: api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: provider
        app.kubernetes.io/component: api
        app.kubernetes.io/part-of: myres
    spec:
      terminationGracePeriodSeconds: 30
      containers:
        - name: myres-provider-svc
          image: erkanozmenli/myres-provider-svc:placeholder
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /health/ready
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 3
          lifecycle:
            preStop:
              exec:
                command: ["sh", "-c", "sleep 10"]