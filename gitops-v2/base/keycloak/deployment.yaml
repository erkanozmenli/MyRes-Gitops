apiVersion: apps/v1
kind: Deployment
metadata:
  name: keycloak-svc
  labels:
    app.kubernetes.io/name: keycloak
    app.kubernetes.io/component: identity
    app.kubernetes.io/part-of: myres

spec:
  replicas: 1

  selector:
    matchLabels:
      app.kubernetes.io/name: keycloak
      app.kubernetes.io/component: identity

  template:
    metadata:
      labels:
        app.kubernetes.io/name: keycloak
        app.kubernetes.io/component: identity
        app.kubernetes.io/part-of: myres

    spec:
      containers:
      - name: keycloak
        image: quay.io/keycloak/keycloak:26.6.1
        env:
          - name: KC_HTTP_ENABLED
            value: "true"
          - name: KC_PROXY_HEADERS
            value: "xforwarded"
        ports:
          - name: http
            containerPort: 8080
        volumeMounts:
          - name: keycloak-data
            mountPath: /opt/keycloak/data
      volumes:
        - name: keycloak-data
          persistentVolumeClaim:
            claimName: keycloak-pvc