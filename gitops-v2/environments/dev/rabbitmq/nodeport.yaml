apiVersion: v1
kind: Service
metadata:
  name: rabbitmq-nodeport
  labels:
    app.kubernetes.io/name: rabbitmq
    app.kubernetes.io/component: message-broker
    app.kubernetes.io/part-of: myres
spec:
  type: NodePort
  selector:
    app.kubernetes.io/name: rabbitmq
    app.kubernetes.io/component: message-broker
  ports:
    - name: amqp
      protocol: TCP
      port: 5672
      targetPort: 5672
      nodePort: 32272
    - name: management
      protocol: TCP
      port: 15672
      targetPort: 15672
      nodePort: 31672
