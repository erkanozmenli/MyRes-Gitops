apiVersion: apps/v1
kind: Deployment
metadata:
  name: provider-svc
spec:
  template:
    spec:
      containers:
        - name: myres-provider-svc
          image: erkanozmenli/myres-provider-svc:0.1.0-alpha.5
          env:
            - name: ASPNETCORE_ENVIRONMENT
              value: DevCluster
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: http://otel-collector:4317
            - name: OTEL_EXPORTER_OTLP_PROTOCOL
              value: grpc
            - name: ConnectionStrings__ProviderServiceConnection
              value: Server=mssql-clusterip,1433;Database=ProviderServiceDb;User Id=sa;Password=YourStrong@Passw0rd;Encrypt=False;TrustServerCertificate=True
            - name: ConnectionStrings__rabbitmq
              value: amqp://guest:guest@rabbitmq:5672
