apiVersion: apps/v1
kind: Deployment
metadata:
  name: keycloak-svc

spec:
  template:
    spec:
      containers:
      - name: keycloak
        args:
          - start-dev
        env:
          - name: KC_BOOTSTRAP_ADMIN_USERNAME
            value: admin
          - name: KC_BOOTSTRAP_ADMIN_PASSWORD
            value: admin
          - name: KC_HOSTNAME
            value: "auth.myres.dev"