apiVersion: apps/v1
kind: Deployment
metadata:
  name: trip-svc
spec:
  template:
    spec:
      containers:
        - name: myres-trip-svc
          image: erkanozmenli/myres-trip-svc:0.1.0-alpha.7
          env:
            - name: ASPNETCORE_ENVIRONMENT
              value: DevCluster
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: http://otel-collector:4317
            - name: OTEL_EXPORTER_OTLP_PROTOCOL
              value: grpc
            - name: ConnectionStrings__TripServiceConnection
              value: Server=mssql-clusterip,1433;Database=TripServiceDb;User Id=sa;Password=YourStrong@Passw0rd;Encrypt=False;TrustServerCertificate=True
            - name: ConnectionStrings__rabbitmq
              value: amqp://guest:guest@rabbitmq:5672
            - name: Database__Initialize
              value: "true"
